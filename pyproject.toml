[project]
name = "p0-warmup"
version = "0.1.0"
description = "CSV 分组统计工具：清洗→聚合→报告→Parquet"
requires-python = ">=3.11"
dependencies = ["pandas", "pyarrow", "numpy"]

[project.scripts]
p0-warmup = "p0_warmup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p0_warmup"]
